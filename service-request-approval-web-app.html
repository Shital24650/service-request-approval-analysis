<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service Request Approval System</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2333;--mute:#5b6478;--line:#dfe3ee;--accent:#2f4fd8;--onacc:#fff;--ok:#1a7f45;--bad:#b83224;--warn:#9a6414;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2e;--ink:#e8ecf6;--mute:#9aa4bb;--line:#2a3347;--accent:#7b93ff;--onacc:#0f1420;--ok:#4cc882;--bad:#ff7b6b;--warn:#e8b45a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2e;--ink:#e8ecf6;--mute:#9aa4bb;--line:#2a3347;--accent:#7b93ff;--onacc:#0f1420;--ok:#4cc882;--bad:#ff7b6b;--warn:#e8b45a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header,main,footer{max-width:920px;margin:0 auto;padding:12px 16px}
h1{font-size:1.3rem;margin:.4rem 0 .2rem}h2{font-size:1.1rem}h3{font-size:.95rem;margin:1rem 0 .4rem}
.sub,.mute{color:var(--mute)}.sub{margin:0;font-size:.9rem}
nav{display:flex;gap:6px;flex-wrap:wrap;max-width:920px;margin:0 auto;padding:0 16px}
nav a{padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;background:var(--card)}
nav a.on{background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
.form{display:grid;gap:10px}label{display:grid;gap:4px;font-size:.9rem}label.inl{display:flex;align-items:center;gap:8px;margin:6px 0}
select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.btn{font:inherit;padding:9px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--onacc);cursor:pointer}
.btn.ok{background:var(--ok);color:var(--bg)}.btn.bad{background:var(--bad);color:var(--bg)}
.ghost{font:inherit;background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:6px 10px;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.acts{display:flex;gap:8px;align-items:center}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.tag.bad,.tag.Rejected{color:var(--bad);border-color:var(--bad)}.tag.Approved{color:var(--ok);border-color:var(--ok)}.tag.Pending{color:var(--warn);border-color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.kpi{display:grid;gap:2px;margin:0}.kpi b{font-size:1.5rem}
.bar{display:grid;grid-template-columns:100px 1fr auto;align-items:center;gap:8px;margin:6px 0;font-size:.9rem}
.bar i{display:block;height:10px;border-radius:6px;background:var(--accent)}.bar em{font-style:normal;color:var(--mute)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
#msg{color:var(--ok);margin:0}
</style></head><body>
<header><h1>Service Request Approval System</h1><p class="sub">Practice build with synthetic data. A web app version of an approval workflow, not a Power Apps app.</p></header>
<nav id="tabs"></nav><main id="view"></main>
<footer><button id="reset" class="ghost">Reset practice data</button></footer>
<script>
const T=["IT Access","Leave","Procurement","Expense"],D=["Finance","HR","IT","Operations","Sales"],SLA={"IT Access":2,"Leave":3,"Procurement":5,"Expense":4};
const R=["Requester 01", "Requester 02", "Requester 03", "Requester 04", "Requester 05", "Requester 06", "Requester 07", "Requester 08", "Requester 09", "Requester 10", "Requester 11", "Requester 12", "Requester 13", "Requester 14", "Requester 15", "Requester 16", "Requester 17", "Requester 18", "Requester 19", "Requester 20"],A=["A. Mehta", "S. Khan", "P. Desai", "R. Iyer"],RAW=[[2,0,17,0,3,3,0],[2,1,7,0,4,-1,2],[2,4,8,0,91,6,0],[3,2,3,0,20,2,0],[1,3,17,0,45,3,0],[3,2,19,1,48,-1,2],[2,1,9,0,90,-1,2],[3,2,5,1,110,2,0],[1,1,5,2,85,3,0],[1,0,7,0,118,3,0],[3,2,6,2,51,2,0],[1,4,17,1,117,1,0],[2,1,16,2,54,4,1],[0,3,19,0,6,1,0],[1,0,3,1,76,2,1],[3,2,16,3,43,3,0],[1,4,6,3,13,1,0],[1,0,19,1,20,5,0],[1,2,7,0,14,7,1],[0,0,17,3,72,0,1],[0,4,13,3,60,1,1],[3,2,14,2,96,2,0],[0,0,18,3,28,-1,2],[2,0,7,0,0,-1,2],[3,3,6,3,110,4,0],[2,3,6,0,112,5,0],[0,0,3,0,55,1,0],[1,4,14,3,43,1,0],[1,0,1,0,35,5,0],[3,3,6,2,118,2,0],[3,3,17,2,21,7,0],[0,0,10,0,37,0,0],[0,1,12,0,61,1,0],[3,3,18,1,72,4,0],[3,1,9,2,26,2,0],[1,4,3,0,96,0,1],[1,2,19,0,64,1,0],[2,1,8,0,70,8,0],[3,2,6,1,95,2,0],[1,0,10,3,32,2,1],[2,4,0,0,33,5,0],[0,3,4,0,113,1,0],[1,0,11,2,115,2,1],[3,3,7,1,95,6,0],[0,1,6,2,89,5,0],[1,0,8,1,105,1,0],[2,2,5,1,51,1,0],[0,4,16,0,76,3,0],[1,4,17,3,73,0,0],[1,2,16,1,8,3,1],[2,3,12,3,41,3,0],[2,4,10,2,38,2,0],[1,1,2,1,86,2,0],[1,1,9,3,81,1,0],[3,1,15,0,18,-1,2],[1,3,12,3,113,1,0],[0,0,13,3,88,-1,2],[0,0,14,3,122,1,0],[3,3,19,2,85,4,0],[3,3,8,3,70,1,0],[3,2,14,0,35,4,0],[2,1,4,3,30,3,0],[1,4,14,2,19,0,0],[0,4,12,2,106,3,0],[0,3,17,3,45,1,0],[1,3,5,2,34,0,0],[3,3,4,2,79,5,0],[0,3,8,2,33,1,0],[0,0,0,3,10,0,0],[0,0,18,3,2,1,0],[1,0,5,1,32,1,0],[0,3,12,3,3,2,1],[0,2,19,0,88,1,0],[3,2,2,1,72,2,0],[0,3,4,2,53,0,0],[0,4,15,2,66,1,1],[1,0,8,2,93,1,0],[0,3,10,3,59,2,0],[1,2,17,0,45,2,0],[1,3,15,3,24,-1,2],[2,2,7,2,82,5,0],[2,2,13,1,39,4,0],[1,1,10,0,58,1,0],[2,3,8,1,121,2,0],[3,0,17,3,106,2,0],[0,3,3,0,6,3,0],[2,2,15,0,60,4,0],[3,1,4,1,51,4,0],[0,4,7,2,31,3,0],[1,4,19,0,56,3,0],[2,1,6,1,94,-1,2],[2,3,14,2,20,6,0],[0,0,7,1,29,1,0],[3,1,8,3,80,1,0],[0,2,14,0,21,2,0],[1,0,13,1,38,2,0],[2,4,18,0,3,-1,2],[3,1,15,2,86,4,0],[3,0,15,1,23,3,1],[1,3,17,0,41,4,0],[1,4,0,2,40,1,0],[1,3,1,3,24,3,0],[0,0,0,3,16,1,1],[2,0,14,0,39,6,0],[2,2,13,2,19,9,0],[3,4,16,3,31,1,0],[3,4,18,2,35,0,0],[3,4,12,2,57,2,0],[3,1,13,0,111,6,0],[1,1,15,0,60,5,0],[0,0,16,2,75,0,0],[0,3,8,1,18,2,0],[2,4,12,1,50,14,0],[2,2,7,0,113,1,0],[1,0,1,1,12,1,0],[3,3,18,3,37,3,0],[0,3,18,3,10,1,0],[0,4,5,0,81,4,0],[1,2,14,1,44,1,1],[0,2,18,1,49,0,0],[3,3,8,0,37,-1,2],[2,2,7,1,87,10,0],[0,1,3,0,24,2,0],[1,2,4,0,56,-1,2],[3,4,11,1,41,1,0],[3,2,10,0,32,17,1],[1,4,11,0,9,4,0],[3,2,18,2,1,1,0],[3,4,17,1,120,5,0],[3,2,13,0,28,5,0],[0,3,3,0,121,-1,2],[0,4,13,3,68,1,0],[3,3,19,2,83,-1,2],[3,2,6,2,35,-1,2],[1,4,11,0,30,1,0],[1,4,0,0,24,1,1],[3,4,6,3,31,8,1],[1,1,4,1,18,3,0],[3,0,4,2,14,2,0],[1,3,11,0,95,-1,2],[1,4,9,2,28,0,1],[2,3,12,2,3,-1,2],[2,2,19,3,62,5,0],[0,3,19,1,35,2,0],[1,4,6,2,77,3,0],[1,2,8,1,29,4,0],[3,0,13,0,87,1,1],[2,4,17,1,47,6,0],[2,0,9,1,52,8,0],[1,0,11,1,73,1,0],[0,4,19,0,35,4,0],[2,2,10,1,84,3,0],[0,0,2,3,111,2,0],[1,4,19,0,58,2,0],[3,2,14,2,19,4,0],[1,2,13,0,56,1,0],[0,1,12,0,86,2,0],[0,2,10,0,38,3,1],[0,1,16,1,95,1,0],[0,0,10,2,110,1,0],[2,2,5,2,90,3,0],[3,3,18,2,117,3,0],[1,1,2,0,50,4,0],[1,1,7,0,24,2,1],[0,0,5,2,25,1,0],[1,4,19,1,72,2,0],[3,2,8,0,80,3,0],[1,2,2,0,9,2,0],[2,0,14,3,64,6,0],[1,0,16,3,60,5,0],[0,1,11,1,90,1,0],[3,2,2,1,49,2,0],[0,4,4,1,86,1,0],[0,3,4,0,84,1,0],[1,4,2,2,48,1,0],[1,3,6,3,2,1,0],[3,0,16,0,19,-1,2],[2,1,5,3,112,2,0],[2,3,19,1,5,8,0],[3,3,6,1,100,4,0],[2,3,16,2,73,5,1],[3,0,15,1,104,4,0],[2,0,5,1,13,5,0],[1,1,14,1,65,2,0],[3,4,11,3,53,-1,2],[1,2,4,3,10,0,0],[0,3,14,0,117,3,0],[3,4,16,2,2,9,0],[0,4,14,0,36,1,0],[0,4,7,3,115,2,0],[0,0,16,1,0,1,0],[0,0,12,2,67,3,0],[0,0,18,1,49,3,1],[0,3,5,3,45,3,0],[0,1,1,1,99,0,1],[3,0,6,1,65,8,0],[1,2,8,0,99,-1,2],[3,3,10,3,55,6,1],[1,3,19,3,63,1,0],[1,3,19,2,41,1,0]];
const KEY="sra_v1";
const P=s=>{const[a,b,c]=s.split("-").map(Number);return Date.UTC(a,b-1,c)};
const addDays=(s,n)=>new Date(P(s)+n*864e5).toISOString().slice(0,10);
const diff=(a,b)=>Math.round((P(b)-P(a))/864e5);
const today=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0")};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const seed=()=>RAW.map((x,i)=>{const sub=addDays("2026-07-01",x[4]);return{id:"REQ-"+String(i+1).padStart(4,"0"),type:T[x[0]],dept:D[x[1]],requester:R[x[2]],approver:A[x[3]],submitted:sub,decision:x[5]<0?"":addDays(sub,x[5]),status:["Approved","Rejected","Pending"][x[6]],sla:SLA[T[x[0]]],desc:""}});
let rows;try{const s=localStorage.getItem(KEY);rows=s?JSON.parse(s):seed()}catch(e){rows=seed()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){}};
function stats(l){const dec=l.filter(r=>r.decision);const days=dec.map(r=>diff(r.submitted,r.decision));const br=dec.filter((r,i)=>days[i]>r.sla).length;
return{n:l.length,p:l.filter(r=>r.status==="Pending").length,a:l.filter(r=>r.status==="Approved").length,j:l.filter(r=>r.status==="Rejected").length,avg:days.length?days.reduce((x,y)=>x+y,0)/days.length:0,br:dec.length?br/dec.length*100:0}}
/*UI*/
let me=R[0],ft="All";
const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
const toCsv=()=>["request_id,request_type,department,requester,approver,submitted_date,decision_date,status,sla_days,description"].concat(rows.map(r=>[r.id,r.type,r.dept,r.requester,r.approver,r.submitted,r.decision,r.status,r.sla,q(r.desc||"")].join(","))).join("\n");
const opt=(a,sel)=>a.map(v=>`<option${v===sel?" selected":""}>${esc(v)}</option>`).join("");
const views={
submit:()=>`<h2>Submit a request</h2><div class="card form"><label>Requester<select id="f-r">${opt(R)}</select></label><label>Request type<select id="f-t">${opt(T)}</select></label><label>Department<select id="f-d">${opt(D)}</select></label><label>Description<textarea id="f-x" rows="3" maxlength="300"></textarea></label><p class="mute">SLA by type: IT Access 2 days, Leave 3, Procurement 5, Expense 4.</p><button class="btn" data-a="submit">Submit request</button><p id="msg" role="status"></p></div>`,
manager:()=>{const l=rows.filter(r=>r.status==="Pending").sort((a,b)=>a.submitted<b.submitted?-1:1);const t=today();
return `<h2>Pending approvals (${l.length})</h2>`+(l.length?l.map(r=>{const due=addDays(r.submitted,r.sla);return `<div class="card row"><div><b>${esc(r.id)}</b> · ${esc(r.type)} · ${esc(r.dept)}<br><span class="mute">${esc(r.requester)} · submitted ${r.submitted} · SLA due ${due}</span>${r.desc?`<br>${esc(r.desc)}`:""}${t>due?` <span class="tag bad">Overdue</span>`:""}</div><div class="acts"><button class="btn ok" data-a="approve" data-id="${esc(r.id)}">Approve</button><button class="btn bad" data-a="reject" data-id="${esc(r.id)}">Reject</button></div></div>`}).join(""):`<p class="mute">No pending requests.</p>`)},
my:()=>{const l=rows.filter(r=>r.requester===me).sort((a,b)=>a.submitted<b.submitted?1:-1);
return `<h2>My requests</h2><label class="inl">Requester<select id="f-me">${opt(R,me)}</select></label><div class="card scroll"><table><tr><th>ID</th><th>Type</th><th>Status</th><th>Submitted</th><th>Decision</th><th>Days</th></tr>${l.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.type)}</td><td><span class="tag ${r.status}">${r.status}</span></td><td>${r.submitted}</td><td>${r.decision||"-"}</td><td>${r.decision?diff(r.submitted,r.decision):"-"}</td></tr>`).join("")}</table></div>`},
dash:()=>{const l=ft==="All"?rows:rows.filter(r=>r.type===ft);const s=stats(l);
const card=(k,v)=>`<div class="card kpi"><span class="mute">${k}</span><b>${v}</b></div>`;
const byT=T.map(t=>({k:t,...stats(rows.filter(r=>r.type===t))})),byD=D.map(d=>({k:d,...stats(rows.filter(r=>r.dept===d))}));
const bar=(k,v,max,txt)=>`<div class="bar"><span>${esc(k)}</span><i style="width:${max?Math.max(2,v/max*100):0}%"></i><em>${txt}</em></div>`;
const mt=Math.max(...byT.map(x=>x.avg)),md=Math.max(...byD.map(x=>x.avg));
return `<h2>Dashboard</h2><label class="inl">Request type<select id="f-ft">${opt(["All",...T],ft)}</select></label><div class="kpis">${card("Total requests",s.n)}${card("Pending",s.p)}${card("Approved",s.a)}${card("Rejected",s.j)}${card("Avg approval days",s.avg.toFixed(2))}${card("SLA breach %",s.br.toFixed(1)+"%")}</div><h3>Average approval days by type</h3><div class="card">${byT.map(x=>bar(x.k,x.avg,mt,x.avg.toFixed(2)+" days")).join("")}</div><h3>SLA breach % by type</h3><div class="card">${byT.map(x=>bar(x.k,x.br,100,x.br.toFixed(1)+"%")).join("")}</div><h3>Average approval days by department</h3><div class="card">${byD.map(x=>bar(x.k,x.avg,md,x.avg.toFixed(2)+" days")).join("")}</div><p class="mute">Average approval days and SLA breach % use decided requests only. A breach means approval days greater than SLA days.</p>`},exp:()=>`<h2>Export CSV</h2><p class="mute">Copy the current data, including requests added or decided here. Paste it into a text file saved as service_requests.csv, then import that file into Dataverse or Power BI.</p><button class="btn" data-a="copy">Copy CSV</button> <span id="msg" role="status"></span><textarea id="csv" rows="12" readonly style="width:100%;margin-top:8px;font-family:ui-monospace,monospace;font-size:12px">${esc(toCsv())}</textarea>`};
const V={submit:views.submit,manager:views.manager,"my-requests":views.my,dashboard:views.dash,export:views.exp};
const TABS=[["submit","Submit"],["manager","Manager"],["my-requests","My requests"],["dashboard","Dashboard"],["export","Export CSV"]];
function render(){const h=V[location.hash.slice(1)]?location.hash.slice(1):"submit";
document.getElementById("tabs").innerHTML=TABS.map(([k,n])=>`<a href="#${k}" class="${k===h?"on":""}">${n}</a>`).join("");document.getElementById("view").innerHTML=V[h]()}
addEventListener("hashchange",render);
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
if(a==="submit"){const t=document.getElementById("f-t").value,id="REQ-"+String(rows.length+1).padStart(4,"0");
rows.push({id,type:t,dept:document.getElementById("f-d").value,requester:document.getElementById("f-r").value,approver:"",submitted:today(),decision:"",status:"Pending",sla:SLA[t],desc:document.getElementById("f-x").value.trim()});
save();render();document.getElementById("msg").textContent="Submitted "+id+" as Pending."}
else if(a==="copy"){const c=document.getElementById("csv");c.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.getElementById("msg").textContent=ok?"Copied.":"Select the text and copy it manually."}
else{const r=rows.find(x=>x.id===b.dataset.id);if(r){r.status=a==="approve"?"Approved":"Rejected";r.decision=today();r.approver="Manager";save();render()}}});
document.addEventListener("change",e=>{if(e.target.id==="f-me"){me=e.target.value;render()}if(e.target.id==="f-ft"){ft=e.target.value;render()}});
document.getElementById("reset").onclick=()=>{rows=seed();save();render()};
render();
</script></body></html>
